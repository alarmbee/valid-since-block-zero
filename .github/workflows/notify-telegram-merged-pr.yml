name: Notify Telegram on merged PR

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: read

jobs:
  notify:
    name: Send merged PR to Telegram
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        with:
          script: |
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            const threadId = process.env.TELEGRAM_MESSAGE_THREAD_ID;
            const siteBaseUrlRaw = process.env.SITE_BASE_URL;

            if (!token || !chatId) {
              core.setFailed('Missing required secrets: TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID.');
              return;
            }

            if (!siteBaseUrlRaw || !siteBaseUrlRaw.trim()) {
              core.setFailed('Missing required secret: SITE_BASE_URL.');
              return;
            }

            const siteBaseUrl = siteBaseUrlRaw.trim().replace(/\/+$/, '');

            const pr = context.payload.pull_request;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const number = pr.number ?? '';
            const base = pr.base?.ref ?? '';
            const title = pr.title ?? '';
            const body = pr.body ?? '';
            const url = pr.html_url ?? '';
            const author = pr.user?.login ?? 'unknown';
            const mergedBy = pr.merged_by?.login ?? 'unknown';

            if (/^internal/i.test(String(title).trim())) {
              core.info('PR title starts with "Internal"; skipping Telegram notification.');
              return;
            }

            const prFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const isDocsMarkdownPage = (filename) => {
              if (!filename) return false;
              if (!/^docs\/.+\.md$/.test(filename)) return false;
              return true;
            };

            const fileToRoute = (filename) => {
              const withoutPrefix = String(filename).replace(/^docs\//, '').replace(/\.md$/, '');
              if (withoutPrefix === 'index') return '';
              if (/\/index$/.test(withoutPrefix)) return withoutPrefix.replace(/\/index$/, '/');
              return withoutPrefix;
            };

            const routeToUrl = (route) => {
              const cleanRoute = String(route ?? '').replace(/^\/+/, '');
              if (!cleanRoute) return `${siteBaseUrl}/`;
              return `${siteBaseUrl}/${cleanRoute}`;
            };

            const allNewDocsPages = prFiles
              .filter((f) => f?.status === 'added' && isDocsMarkdownPage(f?.filename))
              .map((f) => f.filename)
              .sort((a, b) => a.localeCompare(b));

            const allUpdatedDocsPages = prFiles
              .filter((f) => (f?.status === 'modified' || f?.status === 'renamed') && isDocsMarkdownPage(f?.filename))
              .map((f) => f.filename)
              .sort((a, b) => a.localeCompare(b));

            const newDocsPages = allNewDocsPages.slice(0, 3);
            const updatedDocsPages = allUpdatedDocsPages.slice(0, 3);
            const hasMoreNewDocsPages = allNewDocsPages.length > 3;
            const hasMoreUpdatedDocsPages = allUpdatedDocsPages.length > 3;

            const newContentUrls = newDocsPages
              .map(fileToRoute)
              .map(routeToUrl);

            const updatedUrls = updatedDocsPages
              .map(fileToRoute)
              .map(routeToUrl);

            if (hasMoreNewDocsPages) newContentUrls.push('...');
            if (hasMoreUpdatedDocsPages) updatedUrls.push('...');

            const summary = body.trim().length ? body.trim() : '(no description)';
            const maxLen = 1200;
            const shortSummary = summary.length > maxLen ? summary.slice(0, maxLen - 1) + '…' : summary;

            const escapeHtml = (s) => String(s)
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');

            const formatUrl = (u) => {
              const url = String(u);
              if (url === '...') return '...';
              const safe = escapeHtml(url);
              return `<a href="${safe}">${safe}</a>`;
            };

            const text = [
              `<b>Merged PR</b> <code>${escapeHtml(repo)}#${escapeHtml(number)}</code> → <code>${escapeHtml(base)}</code>`,
              `<b>${escapeHtml(title)}</b>`,
              '',
              `${escapeHtml(shortSummary)}`,
              '',
              `<a href="${escapeHtml(url)}">Open on GitHub</a>`,
              `<i>Author:</i> ${escapeHtml(author)}  <i>Merged by:</i> ${escapeHtml(mergedBy)}`,
              ...(updatedUrls.length ? ['','<b>Updated:</b>'].concat(updatedUrls.map(formatUrl)) : []),
              ...(newContentUrls.length ? ['','<b>New content:</b>'].concat(newContentUrls.map(formatUrl)) : []),
            ].join('\n');

            const params = new URLSearchParams();
            params.set('chat_id', chatId);
            params.set('text', text);
            params.set('parse_mode', 'HTML');
            params.set('disable_web_page_preview', 'true');
            if (threadId) params.set('message_thread_id', threadId);

            const resp = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: params.toString(),
            });

            const json = await resp.json().catch(() => ({}));
            if (!resp.ok || !json.ok) {
              core.setFailed(
                `Telegram sendMessage failed (${resp.status} ${resp.statusText}): ${JSON.stringify(json)}`
              );
              return;
            }

            core.info(`Telegram message sent: message_id=${json.result?.message_id}`);
